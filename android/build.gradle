
buildscript {
    repositories {
        mavenCentral()
    }

    // dependencies {
    //     classpath 'com.android.tools.build:gradle:1.3.1'
    // }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.alentoma.selectabletext'
    compileSdkVersion rootProject.ext.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
    defaultConfig {
        // minSdkVersion safeExtGet("minSdkVersion", 24)
        // targetSdkVersion safeExtGet("targetSdkVersion", 35)
        versionCode 1
        versionName "1.0"
    }
    lintOptions {
        abortOnError false
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.facebook.react:react-native:+'
}
